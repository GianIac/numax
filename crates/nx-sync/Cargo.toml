[package]
name = "nx-sync"
version = "0.1.3"
edition = "2024"
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
wincode = { version = "0.6.0", features = ["derive"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
