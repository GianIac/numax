[package]
name = "nx-core"
version = "0.1.5"
edition = "2024"
license.workspace = true

[features]
cpu-profiling = ["dep:inferno", "dep:pprof"]
heap-profiling = ["dep:dhat"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
getrandom = "0.4"
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
mdns-sd = { version = "0.21", default-features = false, features = ["async"] }
sha2 = "0.11.0"
serde_json = "1"
wasmtime = "47.0.4"
wasmtime-wasi = "47.0.4"
nx-store = { version = "0.1.5", path = "../nx-store" }
nx-sync = { version = "0.1.5", path = "../nx-sync" }
nx-net = { version = "0.1.5", path = "../nx-net" }
tokio = { version = "1", features = ["fs", "io-util", "net", "signal", "sync", "time"] }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
dhat = { version = "0.3.3", optional = true }
inferno = { version = "0.12.8", optional = true, default-features = false }
pprof = { version = "0.15", optional = true, default-features = false }

[dev-dependencies]
nx-store = { version = "0.1.5", path = "../nx-store", features = ["test-utils"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[[bench]]
name = "three_node_sync_load"
harness = false

[[bench]]
name = "chaos_sync_load"
harness = false
