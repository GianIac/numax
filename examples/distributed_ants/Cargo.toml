[package]
name = "distributed_ants"
version = "0.1.4"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
nx-sdk = { version = "0.1.6", path = "../../crates/nx-sdk" }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"

[workspace]
