<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" role="img" aria-labelledby="title desc">
<title id="title">PNCounter state merge</title><desc id="desc">Merge takes maxima for each positive and negative origin slot, then subtracts total negative counts from total positive counts.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#59677d"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#202c40}.node{fill:#f3f1ff;stroke:#8271bd;stroke-width:1.5}.good{fill:#eaf8f2;stroke:#368565}.warn{fill:#fff3e8;stroke:#b47a3b}.muted{fill:#f1f3f7;stroke:#8692a4}.edge{fill:none;stroke:#59677d;stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:14px;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}.sub{font-size:14px;fill:#47566d}</style>
<rect width="640" height="390" rx="12" fill="white"/>
<text x="320.0" y="30" text-anchor="middle" font-size="20" font-weight="600">PNCounter state merge</text>
<path class="edge" d="M165.0,150 L320.0,225"/>

<path class="edge" d="M475.0,150 L320.0,225"/>

<path class="edge" d="M320.0,300 L320.0,330"/>
<rect class="node " x="25" y="70" width="280" height="80" rx="9"/>
<text x="165.0" y="100.0" text-anchor="middle" font-size="16" font-weight="600">Node A</text>
<text class="sub" x="165.0" y="121.0" text-anchor="middle">P[A] = 10; N[A] = 3; value = 7</text>
<rect class="node " x="335" y="70" width="280" height="80" rx="9"/>
<text x="475.0" y="100.0" text-anchor="middle" font-size="16" font-weight="600">Node B</text>
<text class="sub" x="475.0" y="121.0" text-anchor="middle">P[B] = 5; N[B] = 8; value = -3</text>
<rect class="node " x="95" y="225" width="450" height="75" rx="9"/>
<text x="320.0" y="252.5" text-anchor="middle" font-size="16" font-weight="600">Merge each origin slot by maximum</text>
<text class="sub" x="320.0" y="273.5" text-anchor="middle">P = {A:10, B:5}; N = {A:3, B:8}</text>
<rect class="node good" x="155" y="330" width="330" height="40" rx="9"/>
<text x="320.0" y="355.0" text-anchor="middle" font-size="16" font-weight="600">Visible value: 15 - 11 = 4</text>
</svg>
