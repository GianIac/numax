<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" role="img" aria-labelledby="title desc">
<title id="title">Repair missing CRDT state</title><desc id="desc">Missing positions are replayed if retained; unavailable history can use a dominating complete baseline. Explicit refusal is scoped to its source.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#59677d"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#202c40}.node{fill:#f3f1ff;stroke:#8271bd;stroke-width:1.5}.good{fill:#eaf8f2;stroke:#368565}.warn{fill:#fff3e8;stroke:#b47a3b}.muted{fill:#f1f3f7;stroke:#8692a4}.edge{fill:none;stroke:#59677d;stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:14px;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}.sub{font-size:14px;fill:#47566d}</style>
<rect width="640" height="760" rx="12" fill="white"/>
<text x="320.0" y="30" text-anchor="middle" font-size="20" font-weight="600">Repair missing CRDT state</text>
<path class="edge" d="M320.0,129 L320.0,170"/>
<text class="label" x="320.0" y="141.5" text-anchor="middle">Gap found</text>
<path class="edge" d="M320.0,234 L165.0,310"/>
<text class="label" x="242.5" y="264.0" text-anchor="middle">Retained</text>
<path class="edge" d="M320.0,234 L475.0,310"/>
<text class="label" x="397.5" y="264.0" text-anchor="middle">Unavailable</text>
<path class="edge" d="M165.0,382 L165.0,580"/>
<text class="label" x="165.0" y="473.0" text-anchor="middle">Persist before publish</text>
<path class="edge" d="M475.0,382 L475.0,440"/>
<path class="edge" d="M475.0,512 L165.0,580"/>
<text class="label" x="320.0" y="538.0" text-anchor="middle">Dominating complete cut</text>
<path class="edge" d="M475.0,512 L475.0,580"/>
<text class="label" x="475.0" y="538.0" text-anchor="middle">Outside contract</text>
<path class="edge" d="M165.0,655 L320.0,695"/>
<path class="edge" d="M475.0,655 L320.0,695"/>
<text class="label" x="397.5" y="667.0" text-anchor="middle">Another source may help</text>
<rect class="node " x="155" y="65" width="330" height="64" rx="9"/>
<text x="320.0" y="87.0" text-anchor="middle" font-size="16" font-weight="600">Compare history and receipts</text>
<text class="sub" x="320.0" y="108.0" text-anchor="middle">Known maximum is not receipt</text>
<rect class="node " x="155" y="170" width="330" height="64" rx="9"/>
<text x="320.0" y="192.0" text-anchor="middle" font-size="16" font-weight="600">Request missing positions</text>
<text class="sub" x="320.0" y="213.0" text-anchor="middle">Source, origin, attempt and deadline</text>
<rect class="node good" x="25" y="310" width="280" height="72" rx="9"/>
<text x="165.0" y="336.0" text-anchor="middle" font-size="16" font-weight="600">Retained history available</text>
<text class="sub" x="165.0" y="357.0" text-anchor="middle">Apply correlated replay page</text>
<rect class="node " x="335" y="310" width="280" height="72" rx="9"/>
<text x="475.0" y="336.0" text-anchor="middle" font-size="16" font-weight="600">History unavailable</text>
<text class="sub" x="475.0" y="357.0" text-anchor="middle">Request complete CRDT baseline</text>
<rect class="node " x="335" y="440" width="280" height="72" rx="9"/>
<text x="475.0" y="466.0" text-anchor="middle" font-size="16" font-weight="600">Validate baseline and cut</text>
<text class="sub" x="475.0" y="487.0" text-anchor="middle">Payload, digest, coverage and state</text>
<rect class="node good" x="25" y="580" width="280" height="75" rx="9"/>
<text x="165.0" y="607.5" text-anchor="middle" font-size="16" font-weight="600">Install accepted progress</text>
<text class="sub" x="165.0" y="628.5" text-anchor="middle">State and durable receipt tracking</text>
<rect class="node warn" x="335" y="580" width="280" height="75" rx="9"/>
<text x="475.0" y="607.5" text-anchor="middle" font-size="16" font-weight="600">Explicit source refusal</text>
<text class="sub" x="475.0" y="628.5" text-anchor="middle">Incomplete, oversized or conflicting</text>
<rect class="node muted" x="145" y="695" width="350" height="45" rx="9"/>
<text x="320.0" y="722.5" text-anchor="middle" font-size="16" font-weight="600">Continue periodic repair</text>
</svg>
