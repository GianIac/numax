<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 680" width="640" height="680" role="img" aria-labelledby="title desc">
<title id="title">Peer discovery and runtime paths</title><desc id="desc">Candidates pass admission; active data connections and membership control are separate paths. Gossip and repair do not require membership Alive.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#59677d"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#202c40}.node{fill:#f3f1ff;stroke:#8271bd;stroke-width:1.5}.good{fill:#eaf8f2;stroke:#368565}.warn{fill:#fff3e8;stroke:#b47a3b}.muted{fill:#f1f3f7;stroke:#8692a4}.edge{fill:none;stroke:#59677d;stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:14px;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}.sub{font-size:14px;fill:#47566d}</style>
<rect width="640" height="680" rx="12" fill="white"/>
<text x="320.0" y="30" text-anchor="middle" font-size="20" font-weight="600">Peer discovery and runtime paths</text>
<path class="edge" d="M320.0,131 L320.0,175"/>
<path class="edge" d="M320.0,243 L165.0,320"/>
<text class="label" x="242.5" y="273.5" text-anchor="middle">Data admission</text>
<path class="edge" d="M320.0,243 L475.0,320"/>
<text class="label" x="397.5" y="273.5" text-anchor="middle">Control admission</text>
<path class="edge" d="M165.0,392 L165.0,470"/>
<path class="edge" d="M475.0,392 L475.0,470"/>
<path class="edge" d="M165.0,542 L320.0,590"/>
<path class="edge" d="M475.0,542 L320.0,590"/>
<rect class="node " x="180" y="65" width="280" height="66" rx="9"/>
<text x="320.0" y="88.0" text-anchor="middle" font-size="16" font-weight="600">Endpoint candidates</text>
<text class="sub" x="320.0" y="109.0" text-anchor="middle">Discovery or manual registration</text>
<rect class="node " x="180" y="175" width="280" height="68" rx="9"/>
<text x="320.0" y="199.0" text-anchor="middle" font-size="16" font-weight="600">Handshake and identity policy</text>
<text class="sub" x="320.0" y="220.0" text-anchor="middle">Version, TLS, allowlist and capacity</text>
<rect class="node good" x="35" y="320" width="260" height="72" rx="9"/>
<text x="165.0" y="346.0" text-anchor="middle" font-size="16" font-weight="600">Active data connection</text>
<text class="sub" x="165.0" y="367.0" text-anchor="middle">Admitted transport generation</text>
<rect class="node " x="345" y="320" width="260" height="72" rx="9"/>
<text x="475.0" y="346.0" text-anchor="middle" font-size="16" font-weight="600">Membership control</text>
<text class="sub" x="475.0" y="367.0" text-anchor="middle">Independent one-shot RPCs</text>
<rect class="node good" x="35" y="470" width="260" height="72" rx="9"/>
<text x="165.0" y="496.0" text-anchor="middle" font-size="16" font-weight="600">Gossip and anti-entropy</text>
<text class="sub" x="165.0" y="517.0" text-anchor="middle">Send operations and repair gaps</text>
<rect class="node " x="345" y="470" width="260" height="72" rx="9"/>
<text x="475.0" y="496.0" text-anchor="middle" font-size="16" font-weight="600">Member view and probes</text>
<text class="sub" x="475.0" y="517.0" text-anchor="middle">Alive, Suspect, Dead or Left</text>
<rect class="node muted" x="125" y="590" width="390" height="60" rx="9"/>
<text x="320.0" y="610.0" text-anchor="middle" font-size="16" font-weight="600">Independent observation views</text>
<text class="sub" x="320.0" y="631.0" text-anchor="middle">Connection or Alive does not prove recovery</text>
</svg>
