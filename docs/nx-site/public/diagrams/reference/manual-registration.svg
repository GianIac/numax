<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 670" width="640" height="670" role="img" aria-labelledby="title desc">
<title id="title">Register a manual peer</title><desc id="desc">HTTP registration confirms a stored endpoint candidate, not a connected or authenticated peer. Repeated canonical addresses are idempotent.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#59677d"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#202c40}.node{fill:#f3f1ff;stroke:#8271bd;stroke-width:1.5}.good{fill:#eaf8f2;stroke:#368565}.warn{fill:#fff3e8;stroke:#b47a3b}.muted{fill:#f1f3f7;stroke:#8692a4}.edge{fill:none;stroke:#59677d;stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:14px;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}.sub{font-size:14px;fill:#47566d}</style>
<rect width="640" height="670" rx="12" fill="white"/>
<text x="320.0" y="30" text-anchor="middle" font-size="20" font-weight="600">Register a manual peer</text>
<path class="edge" d="M320.0,125 L320.0,160"/>
<path class="edge" d="M320.0,232 L157.5,300"/>
<text class="label" x="238.75" y="258.0" text-anchor="middle">Duplicate</text>
<path class="edge" d="M320.0,232 L475.0,300"/>
<text class="label" x="397.5" y="258.0" text-anchor="middle">New contribution</text>
<path class="edge" d="M475.0,376 L475.0,435"/>
<text class="label" x="475.0" y="397.5" text-anchor="middle">Flush confirmed</text>
<path class="edge" d="M475.0,376 L157.5,435"/>
<text class="label" x="316.25" y="397.5" text-anchor="middle">Failure after batch</text>
<path class="edge" d="M475.0,505 L475.0,560"/>
<text class="label" x="475.0" y="524.5" text-anchor="middle">Eligible for dialing</text>
<rect class="node " x="155" y="65" width="330" height="60" rx="9"/>
<text x="320.0" y="85.0" text-anchor="middle" font-size="16" font-weight="600">POST /api/v1/peers</text>
<text class="sub" x="320.0" y="106.0" text-anchor="middle">Authenticated JSON request</text>
<rect class="node " x="155" y="160" width="330" height="72" rx="9"/>
<text x="320.0" y="186.0" text-anchor="middle" font-size="16" font-weight="600">Validate endpoint and contribution</text>
<text class="sub" x="320.0" y="207.0" text-anchor="middle">Capacity checked for new contributions</text>
<rect class="node good" x="25" y="300" width="265" height="70" rx="9"/>
<text x="157.5" y="325.0" text-anchor="middle" font-size="16" font-weight="600">Existing manual contribution</text>
<text class="sub" x="157.5" y="346.0" text-anchor="middle">200, created: false</text>
<rect class="node " x="335" y="300" width="280" height="76" rx="9"/>
<text x="475.0" y="328.0" text-anchor="middle" font-size="16" font-weight="600">Persist batch and flush</text>
<text class="sub" x="475.0" y="349.0" text-anchor="middle">Endpoint, schema and cluster scope</text>
<rect class="node good" x="335" y="435" width="280" height="70" rx="9"/>
<text x="475.0" y="460.0" text-anchor="middle" font-size="16" font-weight="600">Publish candidate</text>
<text class="sub" x="475.0" y="481.0" text-anchor="middle">202, created: true</text>
<rect class="node " x="335" y="560" width="280" height="76" rx="9"/>
<text x="475.0" y="588.0" text-anchor="middle" font-size="16" font-weight="600">Normal admission and repair</text>
<text class="sub" x="475.0" y="609.0" text-anchor="middle">No connection implied by 202</text>
<rect class="node warn" x="25" y="435" width="265" height="76" rx="9"/>
<text x="157.5" y="463.0" text-anchor="middle" font-size="16" font-weight="600">Storage outcome uncertain</text>
<text class="sub" x="157.5" y="484.0" text-anchor="middle">500; same address reconciles retry</text>
</svg>
