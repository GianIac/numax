<svg xmlns="http://www.w3.org/2000/svg" width="640" height="210" viewBox="0 0 640 210" role="img" aria-labelledby="title desc"><title id="title">Peer wire frame</title><desc id="desc">Length covers the format tag plus the encoded message.</desc><rect width="640" height="210" rx="12" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#202c40"><text x="320" y="32" text-anchor="middle" font-size="20" font-weight="600">Peer wire frame</text>
<rect x="20" y="67" width="150" height="85" fill="#f3f1ff" stroke="#8271bd"/><text x="95.0" y="102" text-anchor="middle" font-size="16" font-weight="600">Length: 4 bytes</text><text x="95.0" y="129" text-anchor="middle" font-size="14">Big-endian u32</text>
<rect x="170" y="67" width="140" height="85" fill="#eaf8f2" stroke="#8271bd"/><text x="240.0" y="102" text-anchor="middle" font-size="16" font-weight="600">Format: 1 byte</text><text x="240.0" y="129" text-anchor="middle" font-size="14">JSON or Bincode</text>
<rect x="310" y="67" width="310" height="85" fill="#f3f1ff" stroke="#8271bd"/><text x="465.0" y="102" text-anchor="middle" font-size="16" font-weight="600">Encoded message</text><text x="465.0" y="129" text-anchor="middle" font-size="14">Negotiated codec payload</text>
<text x="320" y="187" text-anchor="middle" font-size="14">Length covers the format tag plus the encoded message.</text></g></svg>
