<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 570" width="640" height="570" role="img" aria-labelledby="title desc">
<title id="title">Node transport lifecycle</title><desc id="desc">Construct and validate without binding, take event receivers, start listener, then handle data and control work. Shutdown is explicit and owned.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#59677d"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#202c40}.node{fill:#f3f1ff;stroke:#8271bd;stroke-width:1.5}.good{fill:#eaf8f2;stroke:#368565}.warn{fill:#fff3e8;stroke:#b47a3b}.muted{fill:#f1f3f7;stroke:#8692a4}.edge{fill:none;stroke:#59677d;stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:14px;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}.sub{font-size:14px;fill:#47566d}</style>
<rect width="640" height="570" rx="12" fill="white"/>
<text x="320.0" y="30" text-anchor="middle" font-size="20" font-weight="600">Node transport lifecycle</text>
<path class="edge" d="M320.0,130 L320.0,175"/>
<path class="edge" d="M320.0,240 L320.0,285"/>
<path class="edge" d="M320.0,350 L165.0,420"/>
<text class="label" x="242.5" y="377.0" text-anchor="middle">Running</text>
<path class="edge" d="M320.0,350 L475.0,420"/>
<text class="label" x="397.5" y="377.0" text-anchor="middle">Running</text>
<rect class="node " x="115" y="65" width="410" height="65" rx="9"/>
<text x="320.0" y="87.5" text-anchor="middle" font-size="16" font-weight="600">Construct and validate Node</text>
<text class="sub" x="320.0" y="108.5" text-anchor="middle">Optional bootstrap service</text>
<rect class="node " x="115" y="175" width="410" height="65" rx="9"/>
<text x="320.0" y="197.5" text-anchor="middle" font-size="16" font-weight="600">Take event and control receivers</text>
<text class="sub" x="320.0" y="218.5" text-anchor="middle">Before starting consumers</text>
<rect class="node " x="115" y="285" width="410" height="65" rx="9"/>
<text x="320.0" y="307.5" text-anchor="middle" font-size="16" font-weight="600">Bind and start listener</text>
<text class="sub" x="320.0" y="328.5" text-anchor="middle">Returns actual socket address</text>
<rect class="node good" x="25" y="420" width="280" height="80" rx="9"/>
<text x="165.0" y="450.0" text-anchor="middle" font-size="16" font-weight="600">Data connections</text>
<text class="sub" x="165.0" y="471.0" text-anchor="middle">Inbound and outbound admission</text>
<rect class="node " x="335" y="420" width="280" height="80" rx="9"/>
<text x="475.0" y="450.0" text-anchor="middle" font-size="16" font-weight="600">One-shot control / bootstrap</text>
<text class="sub" x="475.0" y="471.0" text-anchor="middle">Separate from active data peers</text>
</svg>
