name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check GitHub Actions are SHA-pinned
        run: |
          node scripts/check-workflow-action-pins.test.mjs
          node scripts/check-workflow-action-pins.mjs
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1

  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9 # v1.12.0
        with:
          toolchain: stable
          rustflags: ""
      - name: Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Check tokio-console integration
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTFLAGS: --cfg tokio_unstable
        run: cargo check -p nx-cli --features tokio-console

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9 # v1.12.0
        with:
          toolchain: stable
          components: rustfmt
          rustflags: ""
      - name: Format check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9 # v1.12.0
        with:
          toolchain: stable
          components: clippy
          rustflags: ""
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9 # v1.12.0
        with:
          toolchain: stable
          rustflags: ""
      - name: Run tests
        run: cargo test --workspace --verbose

  build-wasm:
    name: Build WASM Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9 # v1.12.0
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          rustflags: ""
      - name: Build distributed_counter
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path examples/distributed_counter/Cargo.toml
      - name: Build distributed_chat
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path examples/distributed_chat/Cargo.toml
      - name: Build vote_tally_tls
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path examples/vote_tally_tls/Cargo.toml
      - name: Build and test Zig guest
        run: |
          examples/guest_zig/build.sh
          node examples/guest_zig/test.mjs

  cli-smoke:
    name: CLI Multi-process Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9 # v1.12.0
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          rustflags: ""
      - name: Build distributed_counter
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path examples/distributed_counter/Cargo.toml
      - name: Build previous release binary
        run: |
          git worktree add "${RUNNER_TEMP}/numax-v0.1.0" v0.1.0
          cargo build --release --manifest-path "${RUNNER_TEMP}/numax-v0.1.0/Cargo.toml" -p nx-cli
      - name: Run multi-process CLI smoke test
        env:
          NUMAX_PREVIOUS_NX_BIN: ${{ runner.temp }}/numax-v0.1.0/target/release/nx
        run: cargo test -p nx-cli --test multiprocess_smoke -- --ignored

  benchmark-tools:
    name: Benchmark Comparator Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Test benchmark comparator
        run: node scripts/compare-benchmark-report.test.mjs

  benchmark-regression:
    name: Benchmark Regression Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: benchmark-tools
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9 # v1.12.0
        with:
          toolchain: stable
          rustflags: ""
      - name: Run sync load benchmark three times
        run: |
          mkdir -p reports/bench
          for run in 1 2 3; do
            cargo bench -p nx-core --bench three_node_sync_load -- \
              --duration-secs 10 \
              --target-ops-sec-per-node 1000 \
              --settle-secs 10 \
              --report "${GITHUB_WORKSPACE}/reports/bench/three-node-sync-smoke-${run}.json"
          done
      - name: Compare median against baseline
        run: |
          set +e
          node scripts/compare-benchmark-report.mjs \
            --baseline crates/nx-core/reports/baselines/three-node-sync-smoke.json \
            --current reports/bench/three-node-sync-smoke-1.json \
            --current reports/bench/three-node-sync-smoke-2.json \
            --current reports/bench/three-node-sync-smoke-3.json \
            --write-aggregate reports/bench/three-node-sync-smoke-median.json \
            --mode blocking \
            --p99-threshold 10 \
            --p99-min-delta-ms 0.1 \
            --throughput-threshold 5 \
            --rss-threshold 10 \
            --rss-min-delta-bytes 16777216 \
            2>&1 | tee reports/bench/comparison.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Benchmark regression gate"
            echo '```text'
            cat reports/bench/comparison.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
      - name: Upload benchmark reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-regression-report
          path: reports/bench/
          if-no-files-found: error

  profiling-artifacts:
    name: Ubuntu Profiling Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9 # v1.12.0
        with:
          toolchain: stable
          rustflags: ""
      - name: Generate Ubuntu CPU flamegraph
        run: |
          mkdir -p reports/profiling
          cargo bench --profile profiling -p nx-core \
            --features cpu-profiling \
            --bench three_node_sync_load -- \
            --duration-secs 10 \
            --target-ops-sec-per-node 1000 \
            --settle-secs 10 \
            --cpu-profile "${GITHUB_WORKSPACE}/reports/profiling/three-node-sync-load.svg"
          test -s reports/profiling/three-node-sync-load.svg
          grep -q '<svg' reports/profiling/three-node-sync-load.svg
      - name: Generate Ubuntu heap profile
        run: |
          cargo bench --profile profiling -p nx-core \
            --features heap-profiling \
            --bench three_node_sync_load -- \
            --duration-secs 5 \
            --target-ops-sec-per-node 250 \
            --settle-secs 5 \
            --heap-profile "${GITHUB_WORKSPACE}/reports/profiling/three-node-sync-load-heap.json"
          test -s reports/profiling/three-node-sync-load-heap.json
          node -e "const p=JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')); if(p.mode!=='rust-heap'||!Array.isArray(p.pps))process.exit(1)" \
            reports/profiling/three-node-sync-load-heap.json
      - name: Upload Ubuntu CPU flamegraph
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpu-flamegraph-ubuntu
          path: reports/profiling/three-node-sync-load.svg
          if-no-files-found: warn
      - name: Upload Ubuntu heap profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heap-profile-ubuntu
          path: reports/profiling/three-node-sync-load-heap.json
          if-no-files-found: warn

  ci-success:
    name: CI Success
    permissions: {}
    needs:
      - cargo-deny
      - check
      - fmt
      - clippy
      - test
      - build-wasm
      - cli-smoke
      - benchmark-tools
      - benchmark-regression
      - profiling-artifacts
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.cargo-deny.result }}" != "success" ]] || \
             [[ "${{ needs.check.result }}" != "success" ]] || \
             [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build-wasm.result }}" != "success" ]] || \
             [[ "${{ needs.cli-smoke.result }}" != "success" ]] || \
             [[ "${{ needs.benchmark-tools.result }}" != "success" ]] || \
             [[ "${{ needs.benchmark-regression.result }}" != "success" ]] || \
             [[ "${{ needs.profiling-artifacts.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed!"
