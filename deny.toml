[graph]
all-features = true

[advisories]
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = [
    # Optional pprof flamegraph renderer; CDDL applies only to this dependency.
    { allow = ["CDDL-1.0"], crate = "inferno@0.11.21" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "native-tls", reason = "Numax uses Rustls to keep the TLS stack explicit and portable." },
    { crate = "openssl", reason = "Numax uses Rustls and does not require the system OpenSSL library." },
    { crate = "openssl-sys", reason = "Numax uses Rustls and does not require the system OpenSSL library." },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
